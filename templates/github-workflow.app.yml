# ==============================================================================
# Standard CI/CD Workflow Template for Apps on the Shared VM
#
# RULE: Build runs on GitHub's free-tier hosted runners;
#       ONLY the final deploy phase executes on the host machine runner.
# ==============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------------------
  # 1. CHECK & TEST: Runs on GitHub-hosted Ubuntu runner (Free Minutes)
  # ----------------------------------------------------------------------------
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || pnpm install --frozen-lockfile
      - run: npm test || pnpm test

  # ----------------------------------------------------------------------------
  # 2. BUILD & PUSH: Runs on GitHub-hosted ARM64 runner (Free Minutes)
  #    Builds the image using GitHub compute and pushes pre-built image to GHCR.
  #    The host VM does NOT compile code or build Docker layers!
  # ----------------------------------------------------------------------------
  build:
    if: github.ref == 'refs/heads/main'
    needs: check
    # Standard GitHub-hosted ARM64 runner (eligible for monthly free minutes)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Name the images
        # Derived from repo name (GHCR names must be lowercase)
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # (Optional) Log in to third-party registries like dhi.io if using hardened base images
      # - name: Log in to Docker Hub / Base Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: dhi.io
      #     username: ${{ secrets.DHI_USERNAME }}
      #     password: ${{ secrets.DHI_TOKEN }}

      - name: Build and push container image(s)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/app:${{ github.sha }}
            ${{ env.IMAGE_REPO }}/app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  # ----------------------------------------------------------------------------
  # 3. DEPLOY: Runs on Host VM Runner
  #    Ultra-lightweight: pulls pre-built image, updates .env, restarts compose.
  # ----------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: [self-hosted, linux, arm64]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Name the images
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Write application configuration
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
          APP_NAME: "my-app" # Adjust to match your app directory in ~/srv/
        run: |
          umask 077
          DEPLOY_PATH="${HOME}/srv/${APP_NAME}"
          mkdir -p "$DEPLOY_PATH"

          # Write environment variables
          echo "IMAGE_REPO=$IMAGE_REPO" > "$DEPLOY_PATH/.env"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$DEPLOY_PATH/.env"

          # Export production environment secrets & vars to .env
          jq -nr '(env.VARS | fromjson) + (env.SECRETS | fromjson)
            | to_entries[]
            | select(.key | test("^(DEPLOY_|DHI_|github_token$)") | not)
            | if (.value | test("\n")) then error("\(.key) spans several lines") else "\(.key)=\(.value)" end' >> "$DEPLOY_PATH/.env"

      - name: Copy docker-compose configuration
        run: |
          cp deploy/docker-compose.yml "${HOME}/srv/my-app/docker-compose.yml"

      - name: Pull pre-built images and restart service
        run: |
          cd "${HOME}/srv/my-app"
          export IMAGE_REPO IMAGE_TAG="${{ github.sha }}"

          # Authenticate to GHCR temporarily to pull private images
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull
          docker logout ghcr.io

          # Restart containers with zero-rebuild
          docker compose up -d --no-build --remove-orphans

          # Healthcheck verification
          for i in $(seq 1 30); do
            # Replace with your app's health endpoint or container check
            curl -fsS http://localhost:PORT/api/health && echo && break
            [ "$i" = 30 ] && { docker compose logs --tail 50; exit 1; }
            sleep 2
          done

          # Cleanup older images of this app only (free disk space)
          docker images --format '{{.Repository}}:{{.Tag}}' | grep "^$IMAGE_REPO/" | grep -v ":$IMAGE_TAG$" | xargs -r docker rmi 2>/dev/null || true
