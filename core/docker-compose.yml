# Shared core infrastructure stack: Cloudflare Tunnel
# Observability and metrics are provided natively by New Relic (systemd service + APM).
name: core

services:
  # Cloudflare Tunnel: Establishes secure outbound tunnel to Cloudflare Edge
  # No inbound firewall ports required on the host.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: core-cloudflared
    restart: unless-stopped
    init: true
    mem_limit: 128m
    cpus: 0.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in core/.env}
    networks:
      - web-gateway

networks:
  web-gateway:
    name: web-gateway
    external: true
