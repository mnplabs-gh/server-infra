# Example Cloudflare Tunnel ingress configuration (if using local config.yml)
# If using Cloudflare Zero Trust Dashboard-managed tunnels, configure Public Hostnames in the UI instead.

tunnel: <YOUR-TUNNEL-UUID>
credentials-file: /etc/cloudflared/<YOUR-TUNNEL-UUID>.json

ingress:
  # Portfolio (Next.js frontend proxies /api to internal Fastify)
  - hostname: portfolio.mnplabs.in
    service: http://portfolio-web:8080
    originRequest:
      noTLSVerify: true
      connectTimeout: 10s

  # AI Interviewer (Web frontend proxies /api to internal Fastify)
  - hostname: ai-interviewer.mnplabs.in
    service: http://ai-interviewer-web:8080
    originRequest:
      noTLSVerify: true
      connectTimeout: 10s

  # Portainer CE (Container Management, Live Logs & Stats)
  - hostname: portainer.mnplabs.in
    service: http://core-portainer:9000
    originRequest:
      noTLSVerify: true

  # Fallback 404 rule for unmatched traffic (required as the final rule)
  - service: http_status:404
